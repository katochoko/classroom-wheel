<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="改行で選択肢を入力して、ルーレットを押すだけ。広告のないシンプルな教室用ルーレット。"><title>教室ルーレット</title><link rel="stylesheet" href="style.css?v=20260922-font"></head>
<body>
<header><a class="brand" href="./"><span class="brand-icon" aria-hidden="true">✳</span><span data-i18n="title">教室ルーレット</span></a><div class="header-controls"><label class="language-control"><span data-i18n="language">言語</span><select id="language" aria-label="言語 / Language / Ngôn ngữ"><option value="ja">日本語</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select></label><label class="sound"><input type="checkbox" id="sound" checked> <span data-i18n="sound">音を鳴らす</span></label></div></header>
<main>
<section class="stage" aria-label="ルーレット">
<div class="stage-top"><span class="eyebrow"><span data-i18n="turn">さあ、だれの番？</span></span><span class="badge" id="remaining">6 項目</span></div>
<div class="wheel-wrap"><span class="pointer" aria-hidden="true"></span><button id="wheelButton" aria-label="ルーレットを回す"><canvas id="wheel" width="1000" height="1000"></canvas><span class="hub" id="hub">まわす<span>↻</span></span></button></div>
<div class="stage-bottom"><p id="status" role="status">ルーレットを押してスタート</p><span class="subtle"><span data-i18n="fair">どの選択肢も、同じ確率。</span></span></div>
</section>
<aside class="editor">
<div class="section-heading"><h1><span data-i18n="choices">選択肢</span></h1><span id="count">6 項目</span></div>
<label for="entries" class="help"><span data-i18n="help">1行に1つ。コピー＆ペーストもできます。</span></label>
<textarea id="entries" spellcheck="false" placeholder="ここに選択肢を入力&#10;1行につき1つ" aria-describedby="inputNote">1
2
3
4
5
6</textarea>
<div class="input-footer"><span id="inputNote"><span data-i18n="blank">空の行は無視されます</span></span><button class="text-button" id="clear"><span data-i18n="clear">すべて消す</span></button></div>
<div class="chips" id="chips" aria-label="個別に削除"></div>
<div class="options"><label class="check-row"><input type="checkbox" id="removeWinner"><span><span data-i18n="auto">当たった項目を自動で除外</span><small><span data-i18n="autoHelp">同じ項目が続けて当たらないようにします</span></small></span></label></div>
<button class="reset" id="reset"><span aria-hidden="true">↺</span> <span data-i18n="reset">リセット</span></button><p class="reset-note"><span data-i18n="resetHelp">選択肢と設定を初期状態に戻します（1〜6）</span></p>
</aside>
</main>
<footer><span data-i18n="footer">教室の、ちいさなくじ引き。</span></footer>
<dialog id="result"><div class="result-mark" aria-hidden="true">✦</div><p class="eyebrow"><span data-i18n="selected">選ばれたのは</span></p><h2 id="winner"></h2><p id="resultNote"></p><button id="continue"><span data-i18n="continue">つづける</span></button></dialog>
<script src="i18n.js"></script><script src="app.js?v=20260922-font"></script>
</body></html>
